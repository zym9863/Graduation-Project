[project]
name = "graduation-project"
version = "0.1.0"
description = "Multimodal news recommendation with SigLIP features and news-value annotations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.20.3",
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "torch>=2.2.0",
    "tqdm>=4.66.0",
    "transformers>=4.44.0",
    "sentencepiece>=0.1.97",
    "protobuf>=6.28.0",
]

[project.scripts]
gpnews = "gp_newsrec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/gp_newsrec"]
